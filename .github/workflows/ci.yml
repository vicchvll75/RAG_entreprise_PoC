name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_eval:
        description: "Évaluation complète avec Ragas (appels LLM payants)"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  eval:
    needs: tests
    runs-on: ubuntu-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Évaluation du retrieval (quality gate, quelques centimes d'embeddings)
        if: env.MISTRAL_API_KEY != ''
        run: python eval/run_eval.py --retrieval-only --reindex
      - name: Évaluation complète (Ragas)
        if: env.MISTRAL_API_KEY != '' && inputs.full_eval
        run: python eval/run_eval.py
      - uses: actions/upload-artifact@v4
        if: always() && env.MISTRAL_API_KEY != ''
        with:
          name: eval-results
          path: eval/results/
