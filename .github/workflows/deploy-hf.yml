name: Déploiement Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}  # ex. vicchvll75/rag-entreprise
    steps:
      - uses: actions/checkout@v4
      - name: Pousser un instantané vers le Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          # Le Space est une cible de déploiement : on y pousse un instantané du code, avec
          # l'en-tête YAML que Hugging Face exige en tête du README.
          mkdir /tmp/space
          cp -r Dockerfile .dockerignore requirements.txt src corpus eval /tmp/space/
          {
            printf -- '---\ntitle: RAG Entreprise\nemoji: 🔐\ncolorFrom: blue\ncolorTo: indigo\n'
            printf -- 'sdk: docker\napp_port: 7860\npinned: false\n---\n\n'
            cat README.md
          } > /tmp/space/README.md
          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Déploiement ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
